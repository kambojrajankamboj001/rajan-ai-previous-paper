function make200(arr,cls,sub){
var out=[];
for(var i=0;i<200;i++){
var b=arr[i%arr.length];
var part=Math.floor(i/arr.length)+1;
var q=b;
if(part>1) q=b+" (Part "+part+")";
if(part>2) q=b+" - विस्तार से (Part "+part+")";
if(part>4) q=b+" - महत्वपूर्ण प्रश्न (Part "+part+")";
if(part>6) q=b+" - बोर्ड परीक्षा के लिए (Part "+part+")";
var a="इस प्रश्न का उत्तर अपनी किताब के अनुसार विस्तार से लिखिए। "+b+" के बारे में परिभाषा, उदाहरण, विशेषताएँ और महत्व लिखिए। कम से कम 4-5 अनुच्छेद में लिखिए। पहले भूमिका, फिर मुख्य भाग में 3-4 बिंदु, अंत में निष्कर्ष लिखिए। उदाहरण देकर समझाइए। यही उत्तर बोर्ड परीक्षा में अच्छे नंबर दिलाएगा।";
out.push([q,a]);
}
return out;
}

for(var j=0;j<arr.length;j++){html+='<div class="q-item"><div class="q"><span class="num">'+(j+1)+'.</span> '+arr[j][0]+'</div><div class="a"><b>उत्तर –</b> '+arr[j][1]+'</div></div>';}
html+='</div>';document.getElementById('content').innerHTML=html;
}
