function renderAll(){
document.getElementById('btn-up').className='board-btn'+(curBoard=='up'?' active':'');
document.getElementById('btn-cbse').className='board-btn'+(curBoard=='cbse'?' active':'');
document.getElementById('c10-btn').className='class-btn'+(curClass=='10'?' active':'');
document.getElementById('c12-btn').className='class-btn'+(curClass=='12'?' active':'');
let subs=SUBJECTS[curBoard][curClass];
let sh="";
subs.forEach((s,i)=>{sh+='<button class="sub-btn'+(s==curSub?' active':'')+'" data-i="'+i+'">'+s+'</button>';});
document.getElementById('sub-box').innerHTML=sh;
let btns=document.getElementById('sub-box').getElementsByTagName('button');
for(let i=0;i<btns.length;i++){btns[i].onclick=function(){curSub=SUBJECTS[curBoard][curClass][parseInt(this.getAttribute('data-i'))];renderAll();};}
let html="";
if(curBoard=='up' && curClass=='12' && curSub=='सामान्य हिन्दी'){
html+='<div class="title-box"><b>🔥 UP Board 2027 – कक्षा 12वीं सामान्य हिन्दी</b><br>160 महत्वपूर्ण प्रश्न – एक लाइन में उत्तर</div><div class="q-box">';
hindiQA.forEach((item,i)=>{html+='<div class="q-item"><div class="q"><span class="num">'+(i+1)+'.</span> '+item[0]+'</div><div class="a"><b>उत्तर –</b> '+item[1]+'</div></div>';});
html+='</div>';
} else if(curBoard=='up' && curClass=='12' && curSub=='English'){
html+='<div class="title-box"><b>🔥 UP Board Class 12 English 2027</b><br>100 Important Questions – Answers</div><div class="q-box">';
englishQA.forEach((item,i)=>{html+='<div class="q-item"><div class="q"><span class="num">'+(i+51)+'.</span> '+item[0]+'</div><div class="a"><b>Ans –</b> '+item[1]+'</div></div>';});
html+='</div>';
} else if(curBoard=='up' && curClass=='12' && curSub=='Maths'){
html+='<div class="title-box"><b>🔥 UP Board Class 12 Maths 2027</b><br>100 महत्वपूर्ण प्रश्न – हल सहित</div><div class="q-box">';
mathsQA.forEach((item,i)=>{html+='<div class="q-item"><div class="q"><span class="num">'+(i+1)+'.</span> '+item[0]+'</div><div class="a"><b>हल / उत्तर –</b> '+item[1]+'</div></div>';});
html+='</div>';
} else {
html+='<div class="q-box" style="text-align:center"><b>'+(curBoard=='up'?'UP Board':'CBSE Board')+' - Class '+curClass+' - '+curSub+'</b><br><br>इस Subject के Questions जल्दी आएंगे।<br>अभी Hindi / English / Maths वाला पढ़ लो!</div>';
}
document.getElementById('content').innerHTML=html;
}
document.getElementById('btn-up').onclick=function(){curBoard='up';curSub=SUBJECTS['up'][curClass][0];renderAll();};
document.getElementById('btn-cbse').onclick=function(){curBoard='cbse';curSub=SUBJECTS['cbse'][curClass][0];renderAll();};
document.getElementById('c10-btn').onclick=function(){curClass='10';curSub=SUBJECTS[curBoard]['10'][0];renderAll();};
document.getElementById('c12-btn').onclick=function(){curClass='12';curSub=SUBJECTS[curBoard]['12'][0];renderAll();};
renderAll();
</script>
