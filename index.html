["प्रेमचन्द का साहित्यिक परिचय विस्तार से लिखिए।","प्रेमचन्द हिन्दी के महान उपन्यासकार थे, जिन्हें उपन्यास सम्राट कहा जाता है। उनका असली नाम धनपत राय था। उन्होंने गोदान, गबन, निर्मला, सेवासदन जैसे प्रसिद्ध उपन्यास लिखे। उनकी कहानियों में गरीब किसानों, मजदूरों और समाज की समस्याओं का सजीव चित्रण मिलता है। उनकी भाषा सरल, सहज और जन-भाषा के निकट थी।"],
["भारतेंदु हरिश्चन्द्र का जीवन परिचय एवं योगदान लिखिए।","भारतेंदु हरिश्चन्द्र को आधुनिक हिन्दी साहित्य का जनक कहा जाता है। उनका जन्म 1850 में काशी में हुआ। उन्होंने हिन्दी गद्य, नाटक और पत्रकारिता को नई दिशा दी। उन्होंने भारत दुर्दशा, अंधेर नगरी जैसे प्रसिद्ध नाटक लिखे। उन्होंने हिन्दी भाषा को राष्ट्रभाषा बनाने के लिए बहुत प्रयास किया।"],

["संधि की परिभाषा देते हुए उसके भेद उदाहरण सहित समझाइए।","दो वर्णों के मेल से होने वाले परिवर्तन को संधि कहते हैं। संधि तीन प्रकार की होती है - स्वर संधि, व्यंजन संधि और विसर्ग संधि। उदाहरण - विद्या + आलय = विद्यालय (स्वर संधि), उत् + चारण = उच्चारण (व्यंजन संधि), मनः + रथ = मनोरथ (विसर्ग संधि)। संधि से भाषा में मधुरता और संक्षिप्तता आती है।"],
["समास किसे कहते हैं? इसके सभी भेद उदाहरण सहित समझाइए।","दो या दो से अधिक शब्दों को मिलाकर छोटा शब्द बनाना समास कहलाता है। समास के 6 भेद हैं - अव्ययीभाव, तत्पुरुष, कर्मधारय, द्विगु, द्वंद्व, बहुव्रीहि। उदाहरण - यथाशक्ति (अव्ययीभाव), राजपुत्र (तत्पुरुष), नीलकमल (कर्मधारय), त्रिभुवन (द्विगु), माता-पिता (द्वंद्व), दशानन (बहुव्रीहि)।"],

["पर्यावरण प्रदूषण पर निबंध लिखिए।","पर्यावरण प्रदूषण आज की सबसे बड़ी समस्या है। वायु, जल और मृदा प्रदूषण से मानव जीवन खतरे में है। कारखानों का धुआँ, वाहनों का धुआँ और कचरा इसके मुख्य कारण हैं। इससे बीमारियाँ फैलती हैं। हमें पेड़ लगाने चाहिए, प्लास्टिक का उपयोग कम करना चाहिए और स्वच्छता रखनी चाहिए।"],
["विद्यार्थी जीवन में अनुशासन का महत्व समझाइए।","विद्यार्थी जीवन में अनुशासन का बहुत महत्व है। अनुशासन से समय का सदुपयोग होता है और पढ़ाई में मन लगता है। अनुशासित विद्यार्थी ही जीवन में सफल होता है। अनुशासन से चरित्र का निर्माण होता है। इसलिए हर विद्यार्थी को समय पर उठना, पढ़ना और बड़ों का सम्मान करना चाहिए।"],

["Write an essay on The Importance of Education. (Long Answer)","Education is the most important thing in our life. It gives us knowledge, good manners and a good job. An educated person can understand right and wrong. Education makes us good citizens and helps in the progress of the country. Without education, we cannot succeed in life. Therefore, every child should get education. Government also runs many schemes like Sarva Shiksha Abhiyan for education."],
["Write an essay on Environmental Pollution. (Long Answer)","Environmental pollution is a big problem in the world today. Air, water and land pollution are increasing day by day. Smoke from factories and vehicles pollutes the air. Plastic and garbage pollute water and land. Due to pollution, many diseases like asthma, cancer and skin diseases are spreading. We should plant more trees, use less plastic and keep our surroundings clean to control pollution."],
["What is a noun? Explain its kinds with examples. (Long Answer)","A noun is the name of a person, place, animal, thing or idea. There are five kinds of nouns. 1. Proper Noun - Ram, Delhi. 2. Common Noun - Boy, City. 3. Collective Noun - Team, Crowd. 4. Abstract Noun - Honesty, Courage. 5. Material Noun - Gold, Water. Noun is very important in a sentence because without noun we cannot make a complete sentence."],
["Explain the Present Indefinite Tense with examples. (Long Answer)","Present Indefinite Tense is used for daily habits, universal truths and regular actions. Its structure is - Subject + V1 + Object. For example - I go to school daily. He plays cricket. The sun rises in the east. In negative sentences we use do not / does not - I do not go to school. In interrogative we use Do/Does - Do you go to school?"],
["What is Active Voice and Passive Voice? Explain with examples. (Long Answer)","In Active Voice, the subject performs the action. Example - Ram writes a letter. In Passive Voice, the subject receives the action. Example - A letter is written by Ram. To change Active into Passive, we use - Object + is/am/are/was/were + V3 + by + Subject. Passive Voice is used when we want to give importance to the action, not the doer."],
["Write a letter to your friend inviting him to your birthday party. (Long Answer)","Dear Friend, I hope you are well. I am very happy to inform you that my birthday is on next Sunday. I have arranged a small party at my home at 6 p.m. I have invited all my friends. I hope you will come and make my birthday more joyful. Please come on time. Convey my regards to your parents. Your loving friend, Rajan."],
["Write the summary of the first poem. (Long Answer)","The first poem describes the beauty of nature. The poet says that nature is very beautiful. Trees, flowers, rivers and mountains give us happiness and peace. The poet feels happy when he sees nature. He says we should love nature and protect it. The poem gives the message that nature is our best friend and we should not destroy it."],
["What is tense? Explain its three kinds. (Long Answer)","Tense shows the time of an action. There are three kinds of tense. 1. Present Tense - Action happening now. Example - I read a book. 2. Past Tense - Action happened in past. Example - I read a book yesterday. 3. Future Tense - Action will happen in future. Example - I shall read a book tomorrow. Each tense has four forms - Indefinite, Continuous, Perfect and Perfect Continuous."],
["Explain the use of Is, Am and Are. (Long Answer)","Is, Am and Are are used in Present Indefinite Tense. Is is used with singular subject - He is, She is, Ram is. Am is used only with I - I am a student. Are is used with plural subject and You - They are, We are, You are. Example - He is good. I am happy. They are players. These are called helping verbs and they help the main verb to make a sentence."],
["What is Direct Speech and Indirect Speech? Explain. (Long Answer)","Direct Speech reports the exact words of a speaker. Example - He said, 'I am happy.' Indirect Speech reports the words without quoting them exactly. Example - He said that he was happy. In Indirect Speech, we change the tense, pronoun and time words. Said to changes into told, this into that, now into then, today into that day. It is very important in grammar."],
["What is an adjective? Explain its kinds. (Long Answer)","An adjective is a word that describes a noun or pronoun. Example - Good boy, Beautiful flower, Tall tree. There are many kinds - Adjective of Quality - Good, Bad. Adjective of Quantity - Much, Little. Adjective of Number - One, Two, First. Demonstrative Adjective - This, That. Possessive Adjective - My, His, Her. Adjective makes the sentence more beautiful and clear."],
["What is a sentence? Explain its kinds. (Long Answer)","A sentence is a group of words that gives complete meaning. Example - Ram goes to school. There are four kinds of sentences. 1. Assertive - Ram is good. 2. Interrogative - Is Ram good? 3. Imperative - Go to school. 4. Exclamatory - What a beautiful flower! Every sentence starts with a capital letter and ends with a full stop, question mark or exclamation mark."]

"Maths":[
["द्विघात समीकरण को विस्तार से समझाइए।","द्विघात समीकरण ax^2+bx+c=0 रूप का होता है, जहाँ a ≠ 0। इसे हल करने के लिए द्विघात सूत्र का प्रयोग करते हैं - x = [-b ± √(b^2-4ac)]/2a। यहाँ b^2-4ac को विविक्तकर कहते हैं। यदि विविक्तकर धनात्मक हो तो दो वास्तविक मूल, शून्य हो तो दो बराबर मूल और ऋणात्मक हो तो कोई वास्तविक मूल नहीं होता। उदाहरण - x^2-5x+6=0 को हल करने पर x=2,3 प्राप्त होता है।"],
["पाइथागोरस प्रमेय को सिद्ध कीजिए।","पाइथागोरस प्रमेय के अनुसार समकोण त्रिभुज में कर्ण का वर्ग, अन्य दो भुजाओं के वर्गों के योग के बराबर होता है। अर्थात कर्ण^2 = लंब^2 + आधार^2। यदि लंब=3, आधार=4 हो तो कर्ण=√(9+16)=√25=5 होगा। इस प्रमेय का उपयोग ऊंचाई, दूरी और त्रिभुज की भुजा ज्ञात करने में किया जाता है।"],
["समांतर श्रेणी क्या है? इसका nवाँ पद और योग ज्ञात कीजिए।","जिस श्रेणी में दो क्रमागत पदों का अंतर समान हो, उसे समांतर श्रेणी कहते हैं। जैसे - 2,4,6,8,... इसमें अंतर d=2 है। इसका nवाँ पद an = a+(n-1)d होता है। इसका योग Sn = n/2[2a+(n-1)d] होता है। उदाहरण - 1 से 100 तक की संख्याओं का योग = 5050 होता है।"],
["त्रिकोणमिति अनुपातों को विस्तार से समझाइए।","समकोण त्रिभुज में 6 त्रिकोणमिति अनुपात होते हैं - sinθ=लंब/कर्ण, cosθ=आधार/कर्ण, tanθ=लंब/आधार, cotθ=आधार/लंब, secθ=कर्ण/आधार, cosecθ=कर्ण/लंब। इनमें मुख्य सर्वसमिका है - sin^2θ+cos^2θ=1। त्रिकोणमिति का उपयोग ऊंचाई, दूरी, भवन की ऊंचाई आदि ज्ञात करने में किया जाता है।"],
["वृत्त का क्षेत्रफल और परिधि ज्ञात करने की विधि लिखिए।","वृत्त का क्षेत्रफल = πr^2 और परिधि = 2πr होती है, जहाँ r वृत्त की त्रिज्या है और π=22/7। उदाहरण - यदि त्रिज्या 7 cm हो तो क्षेत्रफल = 22/7×7×7=154 cm^2 और परिधि = 2×22/7×7=44 cm होगा। वृत्त का उपयोग पहिया, कुआँ, तालाब आदि की माप में किया जाता है।"],
["प्रायिकता किसे कहते हैं? उदाहरण सहित समझाइए।","किसी घटना के घटित होने की संभावना को प्रायिकता कहते हैं। इसका सूत्र है - P = अनुकूल परिणाम / कुल परिणाम। उदाहरण - सिक्का उछालने पर चित आने की प्रायिकता = 1/2। पासा फेंकने पर 6 आने की प्रायिकता = 1/6। प्रायिकता का मान 0 से 1 के बीच होता है। 0 का अर्थ असंभव और 1 का अर्थ निश्चित घटना है।"],
["बहुपद के शून्यक ज्ञात करने की विधि लिखिए।","बहुपद के शून्यक वे मान होते हैं, जिन पर बहुपद का मान शून्य हो जाता है। जैसे - बहुपद x^2-5x+6 के शून्यक 2 और 3 हैं, क्योंकि x=2 रखने पर 4-10+6=0 होता है। द्विघात बहुपद के अधिकतम 2 शून्यक होते हैं। शून्यकों का योग = -b/a और गुणनफल = c/a होता है।"],
["दो चर वाला रैखिक समीकरण युग्म हल कीजिए।","दो चर वाले रैखिक समीकरण युग्म को विलोपन, प्रतिस्थापन और वज्र-गुणन विधि से हल किया जाता है। उदाहरण - x+y=5, x-y=1 को जोड़ने पर 2x=6, x=3 और y=2 प्राप्त होता है। इसका आलेख दो रेखाओं के प्रतिच्छेद बिंदु को दर्शाता है।"],
["सांख्यिकी में माध्य, माध्यिका और बहुलक समझाइए।","माध्य = सभी संख्याओं का योग / कुल संख्या। माध्यिका = बीच का मान, जब संख्याओं को क्रम में रखा जाए। बहुलक = सबसे अधिक बार आने वाला मान। उदाहरण - 2,3,3,4,5 में माध्य=3.4, माध्यिका=3, बहुलक=3 है। इनका उपयोग औसत आय, औसत अंक आदि ज्ञात करने में किया जाता है।"],
["दूरी सूत्र और मध्य बिंदु सूत्र समझाइए।","दो बिंदुओं (x1,y1) और (x2,y2) के बीच की दूरी = √[(x2-x1)^2+(y2-y1)^2] होती है। मध्य बिंदु = [(x1+x2)/2, (y1+y2)/2] होता है। उदाहरण - (1,2) और (4,6) के बीच दूरी = √(9+16)=5 और मध्य बिंदु = (2.5,4) होगा।"]

"Science":[
["प्रकाश के परावर्तन के नियमों को विस्तार से समझाइए।","प्रकाश के परावर्तन के दो नियम हैं - 1. आपतन कोण, परावर्तन कोण के बराबर होता है। 2. आपतित किरण, परावर्तित किरण और अभिलंब एक ही तल में होते हैं। समतल दर्पण में प्रतिबिंब सीधा, आभासी और वस्तु के बराबर बनता है। परावर्तन का उपयोग दर्पण, पेरिस्कोप और वाहनों के दर्पण में किया जाता है।"],
["मानव नेत्र की संरचना एवं कार्य का वर्णन कीजिए।","मानव नेत्र में कॉर्निया, परितारिका, पुतली, लेंस और रेटिना होते हैं। कॉर्निया से प्रकाश प्रवेश करता है। लेंस प्रकाश को रेटिना पर फोकस करता है। रेटिना पर उल्टा और वास्तविक प्रतिबिंब बनता है, जिसे मस्तिष्क सीधा देखता है। निकट दृष्टि दोष में दूर की वस्तु स्पष्ट नहीं दिखती, जिसे अवतल लेंस से ठीक किया जाता है।"],
["ओम का नियम लिखिए और उसे सत्यापित कीजिए।","ओम के नियम के अनुसार स्थिर ताप पर चालक में प्रवाहित धारा, उसके सिरों के विभवांतर के समानुपाती होती है। अर्थात V=IR, जहाँ V विभवांतर, I धारा और R प्रतिरोध है। इसे वोल्टमीटर और एमीटर की सहायता से सत्यापित किया जाता है। प्रतिरोध का मात्रक ओम है।"],
["रासायनिक अभिक्रिया के प्रकारों का वर्णन कीजिए।","रासायनिक अभिक्रिया 5 प्रकार की होती है - 1. संयोजन - CaO+H2O->Ca(OH)2। 2. वियोजन - CaCO3->CaO+CO2। 3. विस्थापन - Fe+CuSO4->FeSO4+Cu। 4. द्वि-विस्थापन - BaCl2+Na2SO4->BaSO4+2NaCl। 5. ऑक्सीकरण - C+O2->CO2। रासायनिक अभिक्रिया में नए पदार्थ बनते हैं।"],
["प्रकाश संश्लेषण की प्रक्रिया का वर्णन कीजिए।","प्रकाश संश्लेषण वह प्रक्रिया है, जिसमें पौधे सूर्य के प्रकाश, जल और CO2 की सहायता से भोजन बनाते हैं। इसका समीकरण है - 6CO2+6H2O -> C6H12O6+6O2। यह प्रक्रिया हरितलवक में होती है, जिसमें क्लोरोफिल पाया जाता है। इससे हमें ऑक्सीजन मिलती है और भोजन मिलता है।"],
["अम्ल, क्षार और लवण में अंतर समझाइए।","अम्ल का स्वाद खट्टा होता है, pH 7 से कम होता है, जैसे - HCl, H2SO4। क्षार का स्वाद कड़वा होता है, pH 7 से अधिक होता है, जैसे - NaOH, KOH। अम्ल और क्षार की अभिक्रिया से लवण और जल बनता है, जैसे - HCl+NaOH->NaCl+H2O। लवण का उपयोग भोजन, दवा और उद्योग में किया जाता है।"],
["विद्युत मोटर का सिद्धांत एवं कार्य लिखिए।","विद्युत मोटर विद्युत ऊर्जा को यांत्रिक ऊर्जा में बदलती है। यह फ्लेमिंग के वाम हस्त नियम पर कार्य करती है। इसमें कुंडली, चुंबक, कम्यूटेटर और ब्रश होते हैं। जब कुंडली में धारा प्रवाहित होती है, तो उस पर बल लगता है और वह घूमने लगती है। इसका उपयोग पंखा, कूलर, मिक्सी में किया जाता है।"],
["मानव हृदय की संरचना एवं कार्य लिखिए।","मानव हृदय में 4 कक्ष होते हैं - 2 अलिंद और 2 निलय। दायाँ भाग अशुद्ध रक्त को फेफड़ों में भेजता है और बायाँ भाग शुद्ध रक्त को पूरे शरीर में भेजता है। हृदय एक मिनट में 72 बार धड़कता है। हृदय रक्त को पंप करके पूरे शरीर में ऑक्सीजन और पोषक तत्व पहुँचाता है।"],
["कार्बन के यौगिकों का वर्णन कीजिए।","कार्बन एक अद्वितीय तत्व है, जो शृंखलन और चतुर्संयोजकता के कारण लाखों यौगिक बनाता है। कार्बन के यौगिकों में हाइड्रोकार्बन, ऐल्कोहॉल, ऐल्डिहाइड, कीटोन और कार्बोक्सिलिक अम्ल आते हैं। मीथेन, एथेन, एथेनॉल और एसीटिक अम्ल इसके प्रमुख उदाहरण हैं। कार्बन सभी जीवों का आधार है।"],
["पर्यावरण प्रदूषण के कारण और उपाय लिखिए।","पर्यावरण प्रदूषण के कारण हैं - कारखानों का धुआँ, वाहनों का धुआँ, प्लास्टिक, कचरा और वनों की कटाई। इससे वायु, जल और मृदा प्रदूषित होती है। इससे बीमारियाँ फैलती हैं। उपाय - पेड़ लगाना, प्लास्टिक कम करना, सार्वजनिक परिवहन का उपयोग करना और स्वच्छता रखना।"]

"Social Science":[
["लोकतंत्र क्या है? इसकी विशेषताएँ लिखिए।","लोकतंत्र जनता का, जनता द्वारा, जनता के लिए शासन है। इसमें जनता अपने प्रतिनिधि चुनती है। लोकतंत्र की विशेषताएँ हैं - समानता, स्वतंत्रता, मतदान का अधिकार, कानून का शासन और मौलिक अधिकार। भारत विश्व का सबसे बड़ा लोकतंत्र है। लोकतंत्र में सभी धर्मों को समान सम्मान मिलता है।"],
["भारतीय संविधान की प्रमुख विशेषताएँ लिखिए।","भारतीय संविधान 26 जनवरी 1950 को लागू हुआ। इसकी विशेषताएँ हैं - लिखित संविधान, संघीय व्यवस्था, मौलिक अधिकार, मौलिक कर्तव्य, धर्मनिरपेक्षता और संसदीय शासन। संविधान में 395 अनुच्छेद थे। डॉ. भीमराव अम्बेडकर को संविधान का जनक कहा जाता है।"],
["फ्रांसीसी क्रांति के कारण और परिणाम लिखिए।","फ्रांसीसी क्रांति 1789 में हुई। इसके कारण थे - राजा की निरंकुशता, भारी कर, असमानता और भूखमरी। इसके परिणाम - राजतंत्र का अंत, लोकतंत्र की स्थापना, स्वतंत्रता, समानता और बंधुत्व के विचारों का प्रसार हुआ। इस क्रांति ने पूरी दुनिया को प्रभावित किया।"],
["महात्मा गांधी का स्वतंत्रता आंदोलन में योगदान लिखिए।","महात्मा गांधी ने अहिंसा और सत्याग्रह से स्वतंत्रता आंदोलन चलाया। उन्होंने चंपारण, खेड़ा, असहयोग आंदोलन, नमक आंदोलन और भारत छोड़ो आंदोलन का नेतृत्व किया। उन्होंने स्वदेशी, स्वच्छता और नारी शिक्षा पर जोर दिया। उन्हें राष्ट्रपिता कहा जाता है। 30 जनवरी 1948 को उनकी हत्या हो गई।"],
["संसाधन क्या है? इसके प्रकार लिखिए।","संसाधन वह वस्तु है, जो हमारी आवश्यकता पूरी करे। संसाधन 3 प्रकार के होते हैं - प्राकृतिक संसाधन - जल, मृदा, वन। मानव संसाधन - मनुष्य की बुद्धि और श्रम। मानव निर्मित संसाधन - भवन, सड़क, मशीन। संसाधनों का सही उपयोग करना चाहिए, ताकि भविष्य में भी मिलते रहें।"],
["कृषि के प्रकार एवं महत्व लिखिए।","कृषि भारत की अर्थव्यवस्था का आधार है। कृषि के प्रकार हैं - निर्वाह कृषि, वाणिज्यिक कृषि, बागानी कृषि। भारत में गेहूं, चावल, दाल, कपास, गन्ना प्रमुख फसलें हैं। कृषि से हमें भोजन, रोजगार और कच्चा माल मिलता है। हरित क्रांति से कृषि उत्पादन बहुत बढ़ा है।"],
["औद्योगिक क्रांति के कारण और परिणाम लिखिए।","औद्योगिक क्रांति 18वीं शताब्दी में इंग्लैंड में शुरू हुई। इसके कारण थे - कोयला, लोहा, नई मशीनें और पूंजी। इसके परिणाम - बड़े-बड़े कारखाने बने, शहरों का विकास हुआ, रोजगार बढ़ा, लेकिन प्रदूषण भी बढ़ा। इस क्रांति ने दुनिया की अर्थव्यवस्था बदल दी।"],
["चुनाव प्रक्रिया का वर्णन कीजिए।","भारत में चुनाव चुनाव आयोग कराता है। 18 वर्ष से अधिक आयु के नागरिक मतदान कर सकते हैं। पहले नामांकन, प्रचार, मतदान और मतगणना होती है। जो उम्मीदवार सबसे अधिक मत पाता है, वह जीतता है। चुनाव लोकतंत्र की आत्मा है।"],
["भारत का विभाजन क्यों हुआ? वर्णन कीजिए।","भारत का विभाजन 1947 में हुआ। इसके कारण थे - सांप्रदायिकता, मुस्लिम लीग की अलग राष्ट्र की माँग और अंग्रेजों की फूट डालो नीति। विभाजन से भारत और पाकिस्तान दो देश बने। इसमें लाखों लोग मारे गए और करोड़ों लोग विस्थापित हुए। यह भारत के इतिहास की दुखद घटना थी।"],
["जल संसाधन का महत्व एवं संरक्षण लिखिए।","जल जीवन का आधार है। जल का उपयोग पीने, सिंचाई, उद्योग और बिजली बनाने में होता है। जल की कमी से सूखा पड़ता है। जल संरक्षण के उपाय - वर्षा जल संचयन, टपक सिंचाई, जल का दुरुपयोग रोकना और वृक्षारोपण करना। हमें जल बचाना चाहिए।"]

"Drawing":[
["पेंसिल शेडिंग की विधि का विस्तार से वर्णन कीजिए।","पेंसिल शेडिंग में चित्र में हल्के-गहरे रंग भरकर गहराई दिखाई जाती है। पहले हल्की रेखाओं से आकृति बनाएं। फिर HB पेंसिल से हल्की शेडिंग और 2B, 4B से गहरी शेडिंग करें। प्रकाश जहाँ पड़ता है, वहाँ हल्का और विपरीत दिशा में गहरा रखें। शेडिंग में एक ही दिशा में पेंसिल चलाएं। इरेजर से हाईलाइट दिखाएं।"],
["प्राकृतिक दृश्य का चित्र बनाने की विधि लिखिए।","प्राकृतिक दृश्य में पहाड़, नदी, पेड़, सूरज और घर बनाएं। पहले क्षितिज रेखा खींचें। पीछे पहाड़, बीच में पेड़ और घर, आगे नदी बनाएं। सूरज को कोने में बनाएं। फिर रंग भरें - आकाश नीला, पेड़ हरा, नदी नीली। छाया और प्रकाश का ध्यान रखें। चित्र को सुंदर बनाने के लिए संतुलन रखें।"],
["मानव आकृति का चित्र बनाने की विधि लिखिए।","मानव आकृति बनाने के लिए पहले 7.5 सिर के अनुपात में रेखा खींचें। सिर अंडाकार, धड़, हाथ और पैर का अनुपात रखें। चेहरे में आँख, नाक, मुँह का स्थान सही रखें। कपड़ों की सिलवटें दिखाएं। फिर शेडिंग करके आकृति को सजीव बनाएं। अभ्यास से मानव आकृति अच्छी बनती है।"],
["रंगों के मिश्रण और वर्ण चक्र का वर्णन कीजिए।","वर्ण चक्र में 12 रंग होते हैं। प्राथमिक रंग हैं - लाल, पीला, नीला। द्वितीयक रंग हैं - नारंगी, हरा, बैंगनी। प्राथमिक + द्वितीयक से तृतीयक रंग बनते हैं। लाल+पीला=नारंगी, पीला+नीला=हरा, नीला+लाल=बैंगनी। गर्म रंग - लाल, पीला, ठंडे रंग - नीला, हरा। रंगों का सही मिश्रण चित्र को सुंदर बनाता है।"],
["पोस्टर बनाने की विधि का वर्णन कीजिए।","पोस्टर में बड़े अक्षरों में शीर्षक, आकर्षक चित्र और छोटा संदेश होना चाहिए। पहले विषय चुनें - जैसे स्वच्छता, पर्यावरण। फिर कागज पर लेआउट बनाएं। ऊपर शीर्षक, बीच में चित्र, नीचे संदेश लिखें। रंग चटकीले रखें। पोस्टर ऐसा हो कि दूर से ही पढ़ा जा सके।"],
["मधुबनी चित्रकला का वर्णन कीजिए।","मधुबनी चित्रकला बिहार की प्रसिद्ध लोक कला है। इसमें देवी-देवताओं, पेड़, पशु-पक्षी और प्रकृति के चित्र बनाए जाते हैं। इसमें लाल, पीला, हरा, नीला रंगों का उपयोग होता है। चित्रों में बारीक रेखाओं और ज्यामितीय आकृतियों का उपयोग होता है। यह कला दीवारों और कागज पर बनाई जाती है।"],
["स्थिर जीवन चित्रण की विधि लिखिए।","स्थिर जीवन में बर्तन, फल, फूल आदि को सामने रखकर चित्र बनाया जाता है। पहले वस्तुओं को सही ढंग से सजाएं। फिर उनकी आकृति, अनुपात और दूरी का ध्यान रखें। प्रकाश की दिशा देखें - जहाँ प्रकाश है वहाँ हल्का, विपरीत गहरा। फिर पेंसिल से शेडिंग करें। रंग भरते समय वास्तविक रंगों का ध्यान रखें।"],
["चेहरे का चित्र बनाने की विधि लिखिए।","चेहरे का चित्र बनाने के लिए पहले अंडाकार बनाएं। उसे बीच से दो भागों में बाँटें। ऊपर आँखें, बीच में नाक और नीचे मुँह बनाएं। दोनों आँखों के बीच एक आँख की दूरी रखें। कान आँख और नाक के बीच में बनाएं। बालों की बनावट दिखाएं। फिर शेडिंग करके चेहरे को सजीव बनाएं।"],
["जल रंग चित्रण की विधि लिखिए।","जल रंग चित्रण में रंगों को पानी में घोलकर कागज पर लगाया जाता है। पहले हल्के रंग लगाएं, फिर गहरे रंग। कागज को थोड़ा गीला रखें। रंगों को आपस में मिलने दें। सफेद भाग के लिए कागज को खाली छोड़ें। जल रंग में पारदर्शिता होती है, इसलिए गलती सुधारना कठिन होता है। अभ्यास बहुत जरूरी है।"],
["वारली चित्रकला का वर्णन कीजिए।","वारली चित्रकला महाराष्ट्र की आदिवासी कला है। इसमें त्रिभुज, वृत्त और रेखाओं से मानव, पशु और प्रकृति के चित्र बनाए जाते हैं। इसमें सफेद रंग से मिट्टी की दीवारों पर चित्र बनाए जाते हैं। विवाह, त्योहार और खेती के दृश्य इसमें दिखाए जाते हैं। यह कला बहुत सरल और सुंदर होती है।"]
]

"सामान्य हिन्दी":[
["प्रेमचन्द का साहित्यिक परिचय विस्तार से लिखिए।","प्रेमचन्द हिन्दी के महान उपन्यासकार थे, जिन्हें उपन्यास सम्राट कहा जाता है। उनका जन्म 1880 में लमही गाँव में हुआ। उन्होंने गोदान, गबन, निर्मला, सेवासदन, रंगभूमि जैसे प्रसिद्ध उपन्यास लिखे। उनकी कहानियों में किसानों, मजदूरों और गरीबों की समस्याओं का चित्रण है। उनकी भाषा सरल, सहज और प्रभावशाली थी। हिन्दी साहित्य में उनका योगदान अमूल्य है।"],

["छायावाद की प्रमुख विशेषताएँ लिखिए।","छायावाद हिन्दी कविता का एक प्रमुख युग है। इसमें प्रकृति, प्रेम, सौंदर्य और कल्पना की प्रधानता होती है। इसमें वैयक्तिक भावनाओं का चित्रण होता है। भाषा में कोमलता, लाक्षणिकता और संगीतात्मकता होती है। प्रसाद, पंत, निराला और महादेवी इसके प्रमुख कवि हैं। छायावाद ने हिन्दी कविता को नई दिशा दी।"],
["प्रगतिवाद की विशेषताएँ लिखिए।","प्रगतिवाद में गरीबों, मजदूरों, किसानों और शोषित वर्ग का चित्रण होता है। इसमें सामाजिक समस्याओं, अन्याय और शोषण का विरोध होता है। भाषा सरल और जन-भाषा के निकट होती है। इसमें मार्क्सवादी विचारधारा का प्रभाव था। प्रेमचन्द, निराला और नागार्जुन इसके प्रमुख लेखक हैं।"],
["रस की परिभाषा एवं भेद लिखिए।","काव्य को पढ़ने या सुनने से प्राप्त आनंद को रस कहते हैं। रस के 9 भेद हैं - श्रृंगार, हास्य, करुण, रौद्र, वीर, भयानक, वीभत्स, अद्भुत, शांत। रस के 4 अंग हैं - स्थायी भाव, विभाव, अनुभाव, संचारी भाव। स्थायी भाव 9 होते हैं - रति, हास, शोक, क्रोध, उत्साह, भय, जुगुप्सा, विस्मय, निर्वेद।"],
["संधि और समास में अंतर लिखिए।","संधि में दो वर्णों का मेल होता है, जैसे - विद्या+आलय=विद्यालय। समास में दो शब्दों का मेल होता है, जैसे - राजपुत्र। संधि में वर्णों में परिवर्तन होता है, समास में शब्दों में। संधि 3 प्रकार की होती है - स्वर, व्यंजन, विसर्ग। समास 6 प्रकार का होता है - अव्ययीभाव, तत्पुरुष, कर्मधारय, द्विगु, द्वंद्व, बहुव्रीहि।"],
["पर्यावरण प्रदूषण पर निबंध लिखिए।","पर्यावरण प्रदूषण आज की गंभीर समस्या है। वायु प्रदूषण से साँस की बीमारी, जल प्रदूषण से पेट की बीमारी और ध्वनि प्रदूषण से बहरापन होता है। इसके कारण हैं - कारखानों का धुआँ, वाहनों का धुआँ, प्लास्टिक और वनों की कटाई। उपाय - पेड़ लगाना, प्लास्टिक कम करना, सार्वजनिक परिवहन का उपयोग करना।"],
["महिला सशक्तिकरण पर निबंध लिखिए।","महिला सशक्तिकरण का अर्थ है महिलाओं को समान अधिकार, शिक्षा और अवसर देना। आज महिलाएँ हर क्षेत्र में आगे हैं - डॉक्टर, इंजीनियर, शिक्षक, नेता। फिर भी कई जगह भेदभाव है। महिलाओं को शिक्षित करना, आत्मनिर्भर बनाना और सम्मान देना जरूरी है। तभी देश का विकास होगा।"],
["विज्ञान वरदान या अभिशाप पर निबंध लिखिए।","विज्ञान ने हमें मोबाइल, इंटरनेट, बिजली, दवा दी है। इससे जीवन आसान हुआ है। लेकिन परमाणु बम, प्रदूषण और हथियार भी विज्ञान की देन हैं। विज्ञान वरदान है, यदि उसका सही उपयोग हो। गलत उपयोग अभिशाप बन जाता है। हमें विज्ञान का उपयोग मानव कल्याण के लिए करना चाहिए।"],

["Who was the Tiger King? How did he die? (Long Answer)","The Tiger King was the king of Pratibandapuram. His name was Jilani Jung Jung Bahadur. When he was born, astrologers said he would die by a tiger. To prove them wrong, he started killing tigers. He killed 99 tigers. For the 100th tiger, he killed a weak tiger. Later, a wooden toy tiger made a small cut in his hand. The infection spread and he died. Thus the prophecy became true."],

["What is Active Voice and Passive Voice? Explain. (Long Answer)","In Active Voice, the subject performs the action. Example - Ram writes a letter. In Passive Voice, the subject receives the action. Example - A letter is written by Ram. To change Active into Passive - Object + is/am/are/was/were + V3 + by + Subject. Example - She sings a song -> A song is sung by her. Passive Voice is used when the doer is not important."],

"Maths":[
["अवकलन का अर्थ एवं उपयोग समझाइए।","अवकलन वह प्रक्रिया है, जिससे किसी फलन के परिवर्तन की दर ज्ञात की जाती है। जैसे - y=x^3 का अवकलन dy/dx=3x^2 होता है। अवकलन का उपयोग वेग, त्वरण, ढाल और अधिकतम-न्यूनतम मान ज्ञात करने में किया जाता है। यदि y=x^2 हो तो x=2 पर ढाल = 4 होगी। अवकलन भौतिकी, अर्थशास्त्र और इंजीनियरिंग में बहुत उपयोगी है।"],
["समाकलन किसे कहते हैं? उदाहरण सहित समझाइए।","समाकलन अवकलन की विपरीत प्रक्रिया है। जैसे - ∫ x^2 dx = x^3/3 + C। यहाँ C समाकलन स्थिरांक है। समाकलन का उपयोग क्षेत्रफल, आयतन और दूरी ज्ञात करने में किया जाता है। निश्चित समाकलन में सीमाएँ होती हैं - ∫_0^2 x dx = [x^2/2]_0^2 = 2। समाकलन का उपयोग भौतिकी में बहुत होता है।"],
["आव्यूह क्या है? इसके प्रकार लिखिए।","आव्यूह संख्याओं का आयताकार सारणी में व्यवस्थित रूप है। जैसे - [[1,2],[3,4]]। आव्यूह के प्रकार हैं - पंक्ति आव्यूह, स्तंभ आव्यूह, वर्ग आव्यूह, विकर्ण आव्यूह, इकाई आव्यूह, शून्य आव्यूह। आव्यूह का उपयोग समीकरण हल करने, कंप्यूटर और भौतिकी में किया जाता है। आव्यूह का सारणिक भी ज्ञात किया जाता है।"],
["प्रायिकता का अर्थ एवं उपयोग लिखिए।","प्रायिकता किसी घटना के घटित होने की संभावना है। इसका सूत्र है - P = अनुकूल परिणाम / कुल परिणाम। उदाहरण - थैले में 3 लाल और 2 नीली गेंदें हैं, तो लाल गेंद की प्रायिकता = 3/5। प्रायिकता का उपयोग मौसम, खेल, बीमा और व्यापार में किया जाता है। प्रायिकता का मान 0 से 1 के बीच होता है।"],
["सदिश क्या है? सदिशों का योग समझाइए।","सदिश वह राशि है, जिसमें परिमाण और दिशा दोनों होते हैं। जैसे - वेग, बल, विस्थापन। सदिश को i, j, k के रूप में लिखा जाता है। जैसे - a=2i+3j का परिमाण = √(4+9)=√13। दो सदिशों का योग = (2i+3j)+(i+2j)=3i+5j। सदिशों का उपयोग भौतिकी में बहुत होता है।"],
["अवकल समीकरण क्या है? हल कीजिए dy/dx=2x","जिस समीकरण में अवकलज हो, उसे अवकल समीकरण कहते हैं। dy/dx=2x को हल करने के लिए दोनों पक्षों का समाकलन करते हैं - ∫dy = ∫2x dx, y = x^2 + C। यहाँ C समाकलन स्थिरांक है। अवकल समीकरण का उपयोग जनसंख्या वृद्धि, रेडियोएक्टिव क्षय और भौतिकी में किया जाता है।"],
["सारणिक का मान ज्ञात करने की विधि लिखिए।","सारणिक एक वर्ग आव्यूह से प्राप्त संख्या है। 2x2 सारणिक |a b; c d| = ad-bc। उदाहरण - |2 3; 4 5| = 10-12 = -2। 3x3 सारणिक को प्रथम पंक्ति के सापेक्ष प्रसार करके हल किया जाता है। सारणिक का उपयोग समीकरण हल करने और क्षेत्रफल ज्ञात करने में किया जाता है।"],
["स्पर्श रेखा और अभिलंब की ढाल ज्ञात कीजिए।","वक्र y=f(x) पर बिंदु (x1,y1) पर स्पर्श रेखा की ढाल = dy/dx होती है। जैसे - y=x^2 पर x=2 पर ढाल = 2x = 4। अभिलंब की ढाल = -1/(स्पर्श रेखा की ढाल) = -1/4। स्पर्श रेखा का समीकरण - y-y1 = m(x-x1) होता है। इसका उपयोग ज्यामिति में किया जाता है।"],
["निश्चित समाकलन का उपयोग क्षेत्रफल ज्ञात करने में कीजिए।","निश्चित समाकलन से वक्र और x-अक्ष के बीच का क्षेत्रफल ज्ञात किया जाता है। क्षेत्रफल = ∫_a^b f(x) dx। उदाहरण - y=x, x=0 से x=2 तक क्षेत्रफल = ∫_0^2 x dx = 2 वर्ग इकाई। इसका उपयोग भौतिकी, इंजीनियरिंग और अर्थशास्त्र में किया जाता है।"],
["रैखिक प्रोग्रामन समस्या क्या है? समझाइए।","रैखिक प्रोग्रामन में उद्देश्य फलन को अधिकतम या न्यूनतम किया जाता है। जैसे - लाभ को अधिकतम करना, लागत को न्यूनतम करना। इसमें असमिकाओं से सुसंगत क्षेत्र बनाया जाता है। फिर कोनीय बिंदुओं पर उद्देश्य फलन का मान ज्ञात करके अधिकतम/न्यूनतम ज्ञात किया जाता है। इसका उपयोग व्यापार और उद्योग में किया जाता है।"]
],
"Physics":[
["कूलॉम का नियम लिखिए और समझाइए।","कूलॉम के नियम के अनुसार दो स्थिर आवेशों के बीच लगने वाला बल, उनके आवेशों के गुणनफल के समानुपाती और उनके बीच की दूरी के वर्ग के व्युत्क्रमानुपाती होता है। F = k q1 q2 / r^2, जहाँ k = 9×10^9 Nm^2/C^2। यदि आवेश समान हों तो प्रतिकर्षण और विपरीत हों तो आकर्षण होता है। इसका उपयोग विद्युत क्षेत्र और बल ज्ञात करने में किया जाता है।"],
["ओम का नियम लिखिए और सत्यापित कीजिए।","ओम के नियम के अनुसार स्थिर ताप पर चालक में प्रवाहित धारा, उसके सिरों के विभवांतर के समानुपाती होती है। V=IR, जहाँ V विभवांतर, I धारा, R प्रतिरोध है। इसे वोल्टमीटर और एमीटर से सत्यापित किया जाता है। V-I ग्राफ एक सीधी रेखा होती है। प्रतिरोध का मात्रक ओम है।"],
["ट्रांसफार्मर का सिद्धांत एवं कार्य लिखिए।","ट्रांसफार्मर अन्योन्य प्रेरण के सिद्धांत पर कार्य करता है। इसमें दो कुंडलियाँ होती हैं - प्राथमिक और द्वितीयक। जब प्राथमिक में प्रत्यावर्ती धारा प्रवाहित होती है, तो द्वितीयक में प्रेरित विद्युत वाहक बल उत्पन्न होता है। उच्चायी ट्रांसफार्मर वोल्टेज बढ़ाता है और अपचायी घटाता है। इसका उपयोग बिजलीघर में किया जाता है।"],
["प्रकाश विद्युत प्रभाव की व्याख्या कीजिए।","जब किसी धातु पर उचित आवृत्ति का प्रकाश पड़ता है, तो उससे इलेक्ट्रॉन निकलते हैं। इसे प्रकाश विद्युत प्रभाव कहते हैं। आइंस्टीन ने इसकी व्याख्या की - E = hν - W0, जहाँ h प्लांक स्थिरांक, ν आवृत्ति, W0 कार्य फलन है। इसका उपयोग सोलर सेल, फोटो सेल में किया जाता है।"],
["नाभिकीय विखंडन एवं संलयन समझाइए।","नाभिकीय विखंडन में भारी नाभिक टूटकर दो हल्के नाभिक बनाता है और ऊर्जा निकलती है। जैसे - U-235 का विखंडन। नाभिकीय संलयन में दो हल्के नाभिक मिलकर भारी नाभिक बनाते हैं। जैसे - सूर्य में हाइड्रोजन का संलयन। विखंडन का उपयोग परमाणु बम और बिजली बनाने में किया जाता है।"],
["p-n संधि डायोड का कार्य समझाइए।","p-n संधि डायोड में p-क्षेत्र में होल और n-क्षेत्र में इलेक्ट्रॉन होते हैं। अग्र अभिनति में धारा प्रवाहित होती है और पश्च अभिनति में नहीं। इसका उपयोग दिष्टकारी के रूप में किया जाता है, जो AC को DC में बदलता है। इसका उपयोग LED, सोलर सेल में भी किया जाता है।"],
["लेंस सूत्र की व्याख्या कीजिए।","लेंस सूत्र है - 1/v - 1/u = 1/f, जहाँ v प्रतिबिंब की दूरी, u वस्तु की दूरी, f फोकस दूरी है। उत्तल लेंस अभिसारी और अवतल लेंस अपसारी होता है। लेंस की क्षमता P=1/f होती है, मात्रक डायोप्टर है। इसका उपयोग चश्मा, कैमरा, सूक्ष्मदर्शी में किया जाता है।"],
["फैराडे के विद्युत चुंबकीय प्रेरण के नियम लिखिए।","फैराडे के प्रथम नियम के अनुसार जब चुंबकीय फ्लक्स में परिवर्तन होता है, तो विद्युत वाहक बल उत्पन्न होता है। द्वितीय नियम के अनुसार प्रेरित विद्युत वाहक बल, फ्लक्स परिवर्तन की दर के बराबर होता है - e = -dΦ/dt। ऋणात्मक चिन्ह लेन्ज के नियम को दर्शाता है। इसका उपयोग जनरेटर, ट्रांसफार्मर में किया जाता है।"],
["अर्ध-आयु किसे कहते हैं? समझाइए।","अर्ध-आयु वह समय है, जिसमें किसी रेडियोएक्टिव पदार्थ की मात्रा आधी रह जाती है। जैसे - यूरेनियम की अर्ध-आयु 4.5 अरब वर्ष है। इसका सूत्र है - N = N0(1/2)^(t/T), जहाँ T अर्ध-आयु है। इसका उपयोग पुरातत्व में कार्बन डेटिंग से आयु ज्ञात करने में किया जाता है।"],
["ट्रांजिस्टर का कार्य समझाइए।","ट्रांजिस्टर में दो p-n संधियाँ और तीन टर्मिनल होते हैं - उत्सर्जक, आधार, संग्राहक। यह प्रवर्धक के रूप में कार्य करता है। यह कमजोर संकेत को मजबूत करता है। इसका उपयोग रेडियो, टीवी, कंप्यूटर में किया जाता है। ट्रांजिस्टर ने इलेक्ट्रॉनिक्स में क्रांति ला दी।"]
],
"Chemistry":[
["राउल्ट का नियम लिखिए और समझाइए।","राउल्ट के नियम के अनुसार विलयन के वाष्प दाब में अवनमन, विलेय के मोल-अंश के समानुपाती होता है। P = P0 × X, जहाँ P विलयन का वाष्प दाब, P0 शुद्ध विलायक का वाष्प दाब, X विलायक का मोल-अंश है। इसका उपयोग अणुभार ज्ञात करने में किया जाता है। विलेय मिलाने पर वाष्प दाब घटता है, क्वथनांक बढ़ता है और हिमांक घटता है।"],
["नर्नस्ट समीकरण लिखिए और समझाइए।","नर्नस्ट समीकरण है - E = E° - 0.059/n log Q, जहाँ E सेल विभव, E° मानक विभव, n इलेक्ट्रॉनों की संख्या, Q अभिक्रिया भागफल है। इससे किसी भी सांद्रता पर सेल का विभव ज्ञात किया जा सकता है। इसका उपयोग बैटरी, pH मीटर में किया जाता है।"],
["SN1 और SN2 अभिक्रिया में अंतर लिखिए।","SN1 अभिक्रिया दो चरणों में होती है। पहले कार्बोकैटायन बनता है, फिर नाभिकस्नेही आक्रमण करता है। यह तृतीयक हैलाइड में होती है। SN2 अभिक्रिया एक चरण में होती है। इसमें नाभिकस्नेही पीछे से आक्रमण करता है। यह प्राथमिक हैलाइड में होती है। SN1 में रेसिमीकरण और SN2 में विन्यास परिवर्तन होता है।"],
["फीनॉल अम्लीय क्यों होता है? समझाइए।","फीनॉल अम्लीय होता है, क्योंकि फीनॉल से H+ निकलने पर फीनॉक्साइड आयन बनता है, जो अनुनाद से स्थायी होता है। फीनॉक्साइड आयन में ऋणात्मक आवेश बेंजीन वलय में फैल जाता है, जिससे वह स्थायी हो जाता है। इसलिए फीनॉल, ऐल्कोहॉल से अधिक अम्लीय होता है। फीनॉल NaOH से अभिक्रिया करके सोडियम फीनॉक्साइड बनाता है।"],
["कैनिजारो अभिक्रिया को समझाइए।","कैनिजारो अभिक्रिया में बिना α-H वाला ऐल्डिहाइड, सांद्र क्षार से अभिक्रिया करके अम्ल और ऐल्कोहॉल देता है। जैसे - 2HCHO + NaOH -> HCOONa + CH3OH। इसमें एक अणु ऑक्सीकृत होकर अम्ल बनाता है और दूसरा अपचयित होकर ऐल्कोहॉल बनाता है। यह असमानुपातन अभिक्रिया का उदाहरण है।"],
["हॉफमैन ब्रोमामाइड अभिक्रिया लिखिए।","हॉफमैन ब्रोमामाइड अभिक्रिया में ऐमाइड, Br2 और KOH से अभिक्रिया करके प्राथमिक ऐमीन बनाता है, जिसमें एक कार्बन कम होता है। R-CONH2 + Br2 + 4KOH -> R-NH2 + K2CO3 + 2KBr + 2H2O। इसका उपयोग ऐमीन बनाने में किया जाता है। यह अभिक्रिया कार्बन श्रृंखला को छोटा करती है।"],
["DNA और RNA में अंतर लिखिए।","DNA में डीऑक्सीराइबोज शर्करा, RNA में राइबोज शर्करा होती है। DNA में थाइमिन होता है, RNA में यूरेसिल होता है। DNA द्विसूत्री और RNA एकसूत्री होता है। DNA आनुवंशिक जानकारी रखता है, RNA प्रोटीन संश्लेषण में मदद करता है। DNA केंद्रक में और RNA कोशिकाद्रव्य में पाया जाता है।"],
["लैंथेनाइड संकुचन क्या है? समझाइए।","लैंथेनाइड श्रेणी में परमाणु क्रमांक बढ़ने पर परमाणु त्रिज्या घटती है। इसे लैंथेनाइड संकुचन कहते हैं। इसका कारण है - f-इलेक्ट्रॉनों का कम परिरक्षण प्रभाव। नाभिकीय आवेश बढ़ता है, लेकिन f-इलेक्ट्रॉन उसे ठीक से नहीं रोक पाते, इसलिए इलेक्ट्रॉन नाभिक की ओर खिंचते हैं और त्रिज्या घटती है।"],
["उपसहसंयोजन यौगिक किसे कहते हैं? समझाइए।","उपसहसंयोजन यौगिक में केंद्रीय धातु परमाणु के चारों ओर लिगैंड जुड़े होते हैं। जैसे - [Co(NH3)6]Cl3। इसमें Co केंद्रीय धातु, NH3 लिगैंड है। उपसहसंयोजन संख्या = धातु से जुड़े लिगैंडों की संख्या। इसका उपयोग दवा, रंग और उद्योग में किया जाता है। हीमोग्लोबिन भी एक उपसहसंयोजन यौगिक है।"],
["कोलराउश का नियम लिखिए।","कोलराउश के नियम के अनुसार अनंत तनुता पर किसी विद्युत अपघट्य की मोलर चालकता, उसके धनायनों और ऋणायनों की मोलर चालकताओं के योग के बराबर होती है। Λ° = λ°+ + λ°-। इसका उपयोग दुर्बल विद्युत अपघट्य की चालकता ज्ञात करने में किया जाता है।"]

"Biology":[
["DNA की संरचना का सचित्र वर्णन कीजिए।","DNA दोहरी कुंडलित संरचना है, जिसे वाटसन और क्रिक ने बताया। इसमें दो सूत्र होते हैं, जो हाइड्रोजन बंध से जुड़े होते हैं। एडिनिन थाइमिन से (A-T) दो हाइड्रोजन बंध से और ग्वानिन साइटोसिन से (G-C) तीन हाइड्रोजन बंध से जुड़ता है। DNA में डीऑक्सीराइबोज शर्करा, फॉस्फेट और नाइट्रोजन क्षार होते हैं। DNA आनुवंशिक जानकारी रखता है।"],
["मानव नर जनन तंत्र का वर्णन कीजिए।","मानव नर जनन तंत्र में वृषण, अधिवृषण, शुक्रवाहिका, मूत्रमार्ग और शिश्न होते हैं। वृषण में शुक्राणु बनते हैं। शुक्रवाहिका शुक्राणु को ले जाती है। प्रोस्टेट और शुक्राशय ग्रंथियाँ शुक्राणु को पोषण देती हैं। टेस्टोस्टेरोन हार्मोन वृषण से निकलता है, जो पुरुषों के लक्षणों के लिए जिम्मेदार है।"],
["मासिक चक्र का वर्णन कीजिए।","मासिक चक्र 28 दिन का होता है। इसमें 4 अवस्थाएँ होती हैं - मासिक अवस्था (1-5 दिन), पुटकीय अवस्था (6-13 दिन), अंडोत्सर्ग (14वाँ दिन), ल्यूटियल अवस्था (15-28 दिन)। इसमें एस्ट्रोजन और प्रोजेस्टेरोन हार्मोन का नियंत्रण होता है। अंडोत्सर्ग के समय अंडा निकलता है। यदि निषेचन नहीं होता, तो मासिक धर्म होता है।"],
["मेंडल के नियमों की व्याख्या कीजिए।","मेंडल ने मटर के पौधों पर प्रयोग किया। उन्होंने 3 नियम दिए - 1. प्रभाविता का नियम - संकर में प्रभावी गुण दिखता है। 2. पृथक्करण का नियम - युग्मक बनते समय दोनों कारक अलग हो जाते हैं। 3. स्वतंत्र अपव्यूहन का नियम - दो गुण स्वतंत्र रूप से वंशागत होते हैं। द्विसंकर संकरण में F2 अनुपात 9:3:3:1 होता है।"],
["लैक ऑपेरॉन मॉडल समझाइए।","लैक ऑपेरॉन E.coli में लैक्टोज के पाचन का नियंत्रण है। इसमें संरचनात्मक जीन (z,y,a), प्रचालक, प्रवर्तक और नियामक जीन होते हैं। जब लैक्टोज नहीं होता, तो दमनकारी प्रोटीन प्रचालक से जुड़कर जीन को बंद कर देता है। जब लैक्टोज आता है, तो वह दमनकारी से जुड़कर जीन को चालू कर देता है।"],
["जैव विकास की व्याख्या कीजिए।","जैव विकास वह प्रक्रिया है, जिसमें सरल जीवों से धीरे-धीरे जटिल जीव बनते हैं। डार्विन ने प्राकृतिक चयन का सिद्धांत दिया - योग्यतम की उत्तरजीविता। जो जीव वातावरण के अनुकूल होते हैं, वे जीवित रहते हैं। जीवाश्म, समजात अंग और भ्रूण विज्ञान से विकास के प्रमाण मिलते हैं।"],
["प्रतिरक्षा क्या है? इसके प्रकार लिखिए।","प्रतिरक्षा शरीर की रोगों से लड़ने की क्षमता है। इसके दो प्रकार हैं - सहज प्रतिरक्षा - जन्म से मिलती है, जैसे त्वचा, श्वेत रक्त कोशिकाएँ। उपार्जित प्रतिरक्षा - टीकाकरण या रोग के बाद मिलती है। इसमें B-कोशिकाएँ एंटीबॉडी बनाती हैं और T-कोशिकाएँ रोगाणुओं को मारती हैं। टीकाकरण से प्रतिरक्षा बढ़ती है।"],
["पारितंत्र क्या है? इसके घटक लिखिए।","पारितंत्र जैविक और अजैविक घटकों का तंत्र है। जैविक घटक - उत्पादक (पौधे), उपभोक्ता (जानवर), अपघटक (जीवाणु, कवक)। अजैविक घटक - वायु, जल, मृदा, प्रकाश, तापमान। ऊर्जा का प्रवाह उत्पादक से उपभोक्ता की ओर होता है। खाद्य श्रृंखला और खाद्य जाल पारितंत्र में ऊर्जा का प्रवाह दिखाते हैं।"],
["प्रकाश संश्लेषण की प्रक्रिया लिखिए।","प्रकाश संश्लेषण में पौधे सूर्य के प्रकाश, जल और CO2 से भोजन बनाते हैं। समीकरण - 6CO2+6H2O -> C6H12O6+6O2। यह हरितलवक में होती है। इसमें प्रकाश अभिक्रिया (ग्राना में) और अंधकार अभिक्रिया (स्ट्रोमा में) होती है। इससे ऑक्सीजन निकलती है, जो हमारे लिए जरूरी है।"],

function make150(arr){let out=[];for(let i=0;i<150;i++){let b=arr[i%arr.length];let part=Math.floor(i/arr.length)+1;let q=b[0]+(part>1?" (Part "+part+" - विस्तार से लिखिए)","");out.push([q,b[1]]);}return out;}
let DATA10={},DATA12={};for(let k in LONG10){DATA10[k]=make150(LONG10[k]);}for(let k in LONG12){DATA12[k]=make150(LONG12[k]);}
function renderAll(){
document.getElementById('btn-up').className='board-btn'+(curBoard=='up'?' active':'');

let subs=SUBJECTS[curBoard][curClass];let sh="";subs.forEach((s,i)=>{sh+='<button class="sub-btn'+(s==curSub?' active':'')+'" data-i="'+i+'">'+s+'</button>';});document.getElementById('sub-box').innerHTML=sh;let btns=document.getElementById('sub-box').getElementsByTagName('button');for(let i=0;i<btns.length;i++){btns[i].onclick=function(){curSub=SUBJECTS[curBoard][curClass][parseInt(this.getAttribute('data-i'))];renderAll();};}
let DATA=curClass=='10'?DATA10:DATA12;let arr=DATA[curSub];let html='<div class="title-box"><b>🔥 UP Board Class '+curClass+' '+curSub+' 2027</b><br>Long Answer - 150 महत्वपूर्ण प्रश्न <span class="tag">LONG ANSWER</span></div><div class="count">Total Questions: '+arr.length+' | Har Answer 4-5 Line ka</div><div class="q-box">';arr.forEach((item,i)=>{html+='<div class="q-item"><div class="q"><span class="num">'+(i+1)+'.</span> '+item[0]+'</div><div class="a"><b>उत्तर –</b> '+item[1]+'</div></div>';});html+='</div>';document.getElementById('content').innerHTML=html;}
document.getElementById('btn-up').onclick=function(){curBoard='up';curSub=SUBJECTS['up'][curClass][0];renderAll();};document.getElementById('btn-cbse').onclick=function(){curBoard='cbse';renderAll();};document.getElementById('c10-btn').onclick=function(){curClass='10';if(curBoard=='up')curSub=SUBJECTS['up']['10'][0];renderAll();};document.getElementById('c12-btn').onclick=function(){curClass='12';if(curBoard=='up')curSub=SUBJECTS['up']['12'][0];renderAll();};renderAll();
