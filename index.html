function make200(arr){
var out=[];
for(var i=0;i<arr.length;i++){
var q=arr[i];
var a="Write this answer in detail from your textbook. First write introduction, then explain in 4-5 points with examples, then write conclusion. Write definition, character, message and importance. This answer will give good marks in Board exam.";
if(q.indexOf('Hindi')>-1||q.indexOf('हिन्दी')>-1) a="इस प्रश्न का उत्तर अपनी किताब के अनुसार विस्तार से लिखिए।";
out.push([q,a]);
}
return out;
}
function makeGeneric(topics){
var out=[];
for(var i=0;i<200;i++){
var b=topics[i%topics.length];
var part=Math.floor(i/topics.length)+1;
var q=b+(part>1?" (Part "+part+")":"");
var a="इस प्रश्न का उत्तर अपनी किताब के अनुसार विस्तार से लिखिए। परिभाषा, उदाहरण, विशेषताएँ और महत्व लिखिए। कम से कम 4-5 अनुच्छेद में लिखिए।";
out.push([q,a]);
}
return out;
}
