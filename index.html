function make150FromBase(base, isQOnly){
  let out=[];
  for(let i=0;i<150;i++){
    let b=base[i%base.length];
    let part=Math.floor(i/base.length)+1;
    if(isQOnly){ out.push([b+(part>1?" (Part "+part+")":""), "इस प्रश्न का उत्तर अपनी पाठ्यपुस्तक के अनुसार विस्तार से लिखिए।"]); }
    else{ out.push([b[0]+(part>1?" (Part "+part+")":""), b[1]]); }
  }
  return out;
}
