function make150(arr){let out=[];for(let i=0;i<150;i++){let b=arr[i%arr.length];let part=Math.floor(i/arr.length)+1;let q=b[0];if(part>1){q=b[0]+" (Part "+part+")";}out.push([q,b[1]]);}return out;}
let DATA={};for(let k in BASE){DATA[k]=make150(BASE[k]);}

function renderAll(){document.getElementById('btn-up').className='board-btn'+(curBoard=='up'?' active':'');document.getElementById('btn-cbse').className='board-btn'+(curBoard=='cbse'?' active':'');document.getElementById('c10-btn').className='class-btn'+(curClass=='10'?' active':'');document.getElementById('c12-btn').className='class-btn'+(curClass=='12'?' active':'');let subs=SUBJECTS[curBoard][curClass];let sh="";subs.forEach((s,i)=>{sh+='<button class="sub-btn'+(s==curSub?' active':'')+'" data-i="'+i+'">'+s+'</button>';});document.getElementById('sub-box').innerHTML=sh;let btns=document.getElementById('sub-box').getElementsByTagName('button');for(let i=0;i<btns.length;i++){btns[i].onclick=function(){curSub=SUBJECTS[curBoard][curClass][parseInt(this.getAttribute('data-i'))];renderAll();};}let html="";if(curBoard=='up'&&curClass=='12'&&DATA[curSub]){let arr=DATA[curSub];html+='<div class="title-box"><b>🔥 UP Board Class 12 '+curSub+' 2027</b><br>150 महत्वपूर्ण प्रश्न - Answer सहित</div><div class="count">Total Questions: '+arr.length+'</div><div class="q-box">';arr.forEach((item,i)=>{html+='<div class="q-item"><div class="q"><span class="num">'+(i+1)+'.</span> '+item[0]+'</div><div class="a"><b>उत्तर –</b> '+item[1]+'</div></div>';});html+='</div>';}else{html+='<div class="q-box" style="text-align:center"><b>'+(curBoard=='up'?'UP Board':'CBSE Board')+' - Class '+curClass+' - '+curSub+'</b><br><br>इस Subject के Questions जल्दी आएंगे।</div>';}document.getElementById('content').innerHTML=html;}
document.getElementById('btn-up').onclick=function(){curBoard='up';curSub=SUBJECTS['up'][curClass][0];renderAll();};document.getElementById('btn-cbse').onclick=function(){curBoard='cbse';curSub=SUBJECTS['cbse'][curClass][0];renderAll();};document.getElementById('c10-btn').onclick=function(){curClass='10';curSub=SUBJECTS[curBoard]['10'][0];renderAll();};document.getElementById('c12-btn').onclick=function(){curClass='12';curSub=SUBJECTS[curBoard]['12'][0];renderAll();};renderAll();
</script></body></html>
