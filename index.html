  for(let i=0; i<papers.length; i++){
    let label = papers[i];
    if(curBoard=='up' && curClass=='12' && i==0) label = '📚 सामान्य हिन्दी - 160 Questions';
    ph += '<button class="paper-btn' + (i==curPaperIndex ? ' active' : '') + '" data-index="'+i+'">' + label + '</button>';
  }
  document.getElementById('paper-box').innerHTML = ph;

  let btns = document.getElementById('paper-box').getElementsByTagName('button');
  for(let i=0; i<btns.length; i++){
    btns[i].onclick = function(){ curPaperIndex = parseInt(this.getAttribute('data-index')); renderAll(); };
  }

  let curPaper = papers[curPaperIndex];
  let boardName = curBoard=='up' ? 'UP Board' : 'CBSE Board';
  let html = "";

  if(curBoard=='up' && curClass=='12' && curPaperIndex==0){
    html += '<div class="q-box" style="background:#fff3e0;border:2px solid #ff6b00;text-align:center"><b style="font-size:19px">🔥 UP Board 2027 – कक्षा 12वीं सामान्य हिन्दी</b><br>160 महत्वपूर्ण प्रश्न – बिना उत्तर</div><div class="q-box">';
    for(let i=0; i<hindi12Questions.length; i++){ html += '<div class="q-item"><span>'+(i+1)+'.</span> '+hindi12Questions[i]+'</div>'; }
    html += '</div>';
  } else {
    html += '<div class="q-box" style="text-align:center"><b>'+boardName+' - Class '+curClass+' - '+curPaper+'</b><br>Paper jaldi aayega</div>';
  }
  for(let year=2025; year>=2010; year--){
    html += '<div class="card"><div><b>'+boardName+' Class '+curClass+' - '+curPaper+' - '+year+'</b></div><a class="btn" href="https://upmsp.edu.in/" target="_blank">Download</a></div>';
  }
  document.getElementById('content').innerHTML = html;
}

document.getElementById('btn-up').onclick = function(){ curBoard='up'; curPaperIndex=0; renderAll(); };
document.getElementById('btn-cbse').onclick = function(){ curBoard='cbse'; curPaperIndex=0; renderAll(); };
document.getElementById('c10-btn').onclick = function(){ curClass='10'; curPaperIndex=0; renderAll(); };
document.getElementById('c12-btn').onclick = function(){ curClass='12'; curPaperIndex=0; renderAll(); };

renderAll();
</script>
</body>
</html>
