<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajan AI - Previous Paper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f4f8}
.top{background:#0b3d91;color:white;padding:25px 15px;text-align:center}
.top h1{font-size:30px}
.top p{font-size:14px;opacity:0.9;margin-top:5px}
.label{text-align:center;font-weight:bold;margin:15px 0 5px;color:#333;font-size:14px}
.boards{display:flex;gap:12px;padding:5px 15px;max-width:600px;margin:auto}
.board-btn{flex:1;padding:20px 10px;border-radius:16px;border:none;cursor:pointer;text-align:center;box-shadow:0 3px 10px #00000020;background:white}
.board-btn b{font-size:20px;display:block}
.board-btn span{font-size:12px;color:#666}
.board-btn.active{background:#0b3d91;color:white}
.board-btn.active span{color:#dbeafe}
.class-box{display:flex;gap:10px;padding:5px 15px;max-width:600px;margin:auto}
.class-btn{flex:1;padding:14px;border-radius:12px;border:2px solid #ff6b00;background:white;color:#ff6b00;font-weight:bold;cursor:pointer;font-size:16px}
.class-btn.active{background:#ff6b00;color:white}
.sub-box{display:flex;gap:8px;padding:5px 15px;max-width:700px;margin:auto;flex-wrap:wrap;justify-content:center}
.sub-btn{padding:10px 16px;border-radius:20px;border:1px solid #00a651;background:white;color:#00a651;font-weight:bold;cursor:pointer;font-size:14px}
.sub-btn.active{background:#00a651;color:white}
.container{padding:10px 15px 15px;max-width:800px;margin:auto}
.section-title{font-size:19px;font-weight:bold;margin:10px 0 12px 2px}
.year-title{background:#0b3d91;color:white;padding:8px 12px;border-radius:8px;font-weight:bold;margin:18px 0 10px;font-size:16px}
.card{background:white;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px #00000010;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h3{font-size:15px}
.card p{font-size:12px;color:#666;margin-top:3px}
.btn{background:#25D366;color:white;text-decoration:none;padding:9px 14px;border-radius:8px;font-weight:bold;font-size:13px;white-space:nowrap}
.footer{text-align:center;padding:20px;color:#888;font-size:13px}
</style>
</head>
<body>

<div class="top">
  <h1>📚 RAJAN AI</h1>
  <p>Previous Year Papers - Free Download</p>
  <p style="font-size:12px;margin-top:8px">Made by Rajan Kamboj</p>
</div>

<!-- OPTION 1 - BOARD -->
<div class="label">👇 1. BOARD CHUNO</div>
<div class="boards">
  <button class="board-btn active" id="btn-up" onclick="showBoard('up')"><b>🏫 UP BOARD</b><span>Bijnor | Hindi Medium</span></button>
  <button class="board-btn" id="btn-cbse" onclick="showBoard('cbse')"><b>🎓 CBSE BOARD</b><span>Maths Side</span></button>
</div>

<!-- OPTION 2 - CLASS - DONO BOARD ME -->
<div class="label">👇 2. CLASS CHUNO</div>
<div class="class-box">
  <button class="class-btn active" id="c10-btn" onclick="showClass('10')">📘 Class 10</button>
  <button class="class-btn" id="c12-btn" onclick="showClass('12')">📗 Class 12</button>
</div>

<!-- OPTION 3 - SUBJECT -->
<div class="label">👇 3. SUBJECT CHUNO</div>
<div class="sub-box" id="sub-box"></div>

<div class="container">
  <div class="section-title" id="main-title">📘 UP Board - Class 10 - All Subjects (2010-2025)</div>
  <div id="paperList"></div>
</div>

<div class="footer">© 2026 Rajan AI - All Papers Free</div>

<script>
let curBoard='up', curClass='10', curSub='All';

// SUBJECTS - SAB KUCH
let DATA = {
  up: {
    '10': ['Hindi','English','Maths','Science','Social Science','Sanskrit','Computer'],
    '12': ['Hindi','English','Maths','Physics','Chemistry','Biology','Computer Science']
  },
  cbse: {
    '10': ['Maths','Science','English','Hindi','Social Science','Sanskrit','Information Technology'],
    '12': ['Maths','Physics','Chemistry','English','Hindi','Computer Science','Physical Education']
  }
};

function showBoard(board){
  curBoard=board; curSub='All';
  document.getElementById('btn-up').classList.toggle('active', board=='up');
  document.getElementById('btn-cbse').classList.toggle('active', board=='cbse');
  renderAll();
}
function showClass(cls){
  curClass=cls; curSub='All';
  document.getElementById('c10-btn').classList.toggle('active', cls=='10');
  document.getElementById('c12-btn').classList.toggle('active', cls=='12');
  renderAll();
}
function renderSubjects(){
  let list = DATA[curBoard][curClass];
  let h = `<button class="sub-btn ${curSub=='All'?'active':''}" onclick="setSub('All')">All Subjects</button>`;
  list.forEach(s=>{
    h += `<button class="sub-btn ${s==curSub?'active':''}" onclick="setSub('${s}')">${s}</button>`;
  });
  document.getElementById('sub-box').innerHTML = h;
}
function setSub(s){ curSub=s; renderAll(); }

function renderAll(){
  renderSubjects();
  let boardName = curBoard=='up' ? 'UP Board' : 'CBSE Board';
  let boardIcon = curBoard=='up' ? '📘' : '📗';
  document.getElementById('main-title').innerText = `${boardIcon} ${boardName} - Class ${curClass} - ${curSub=='All'?'All Subjects':curSub} (2010-2025)`;

  let html="";
  let link = curBoard=='up' ? 'https://upmsp.edu.in/' : 'https://cbseacademic.nic.in/previous-year-question-papers.html';
  let medium = curBoard=='up' ? 'Hindi Medium | Bijnor' : 'English Medium | Maths Side';

  for(let year=2025; year>=2010; year--){
    let subs = DATA[curBoard][curClass];
    let filtered = curSub=='All' ? subs : subs.filter(s=>s==curSub);
    html += `<div class="year-title">📅 Year ${year}</div>`;
    filtered.forEach(sub=>{
      html += `<div class="card"><div><h3>${boardName} Class ${curClass} - ${sub} - ${year}</h3><p>${boardName} | ${medium} | PDF</p></div><a class="btn" href="${link}" target="_blank">Download</a></div>`;
    });
  }
  document.getElementById('paperList').innerHTML = html;
}
renderAll();
</script>
</body>
</html>
