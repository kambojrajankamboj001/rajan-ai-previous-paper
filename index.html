function make150(arr){let out=[];for(let i=0;i<150;i++){let b=arr[i%arr.length];let part=Math.floor(i/arr.length)+1;let q=b[0]+(part>1?" - भाग "+part:"");out.push([q,b[1]]);}return out;}
