{q:"भारतेन्दु हरिश्चन्द्र का साहित्यिक परिचय एवं प्रमुख रचनाएँ लिखिए।",a:"जन्म 1850, काशी में। आधुनिक हिन्दी के जनक कहलाते हैं। इन्होंने नाटक, निबंध, कविता, पत्रकारिता सभी में काम किया। प्रमुख रचनाएँ - भारत दुर्दशा, अंधेर नगरी, सत्य हरिश्चन्द्र, प्रेमजोगिनी।"},
{q:"महावीर प्रसाद द्विवेदी का साहित्यिक परिचय लिखिए।",a:"जन्म 1864, रायबरेली। द्विवेदी युग के प्रवर्तक। सरस्वती पत्रिका के संपादक। भाषा को शुद्ध और सरल बनाया। प्रमुख रचना - हिन्दी भाषा और साहित्य, कविता कलाप।"},
{q:"जयशंकर प्रसाद का साहित्यिक परिचय लिखिए।",a:"जन्म 1889, काशी। छायावाद के प्रमुख स्तंभ। कवि, नाटककार, कहानीकार। प्रमुख रचनाएँ - कामायनी, आँसू, लहर, स्कंदगुप्त, चन्द्रगुप्त, आकाशदीप।"},
{q:"प्रेमचन्द का साहित्यिक परिचय एवं प्रमुख रचनाएँ लिखिए।",a:"जन्म 1880, लमही, वाराणसी। उपन्यास सम्राट कहलाते हैं। प्रमुख रचनाएँ - गोदान, गबन, निर्मला, सेवासदन, रंगभूमि, कफन, ईदगाह, पूस की रात।"},
{q:"महादेवी वर्मा का साहित्यिक परिचय लिखिए।",a:"जन्म 1907, फर्रुखाबाद। छायावाद की प्रमुख कवयित्री, आधुनिक मीरा कहलाती हैं। प्रमुख रचनाएँ - यामा, नीरजा, सांध्यगीत, दीपशिखा, अतीत के चलचित्र।"},
{q:"सूर्यकांत त्रिपाठी निराला का साहित्यिक परिचय लिखिए।",a:"जन्म 1899, बंगाल। छायावाद के प्रमुख कवि, मुक्त छंद के जनक। प्रमुख रचनाएँ - अनामिका, परिमल, गीतिका, तुलसीदास, राम की शक्तिपूजा, सरोज स्मृति।"},
{q:"रामधारी सिंह दिनकर का साहित्यिक परिचय लिखिए।",a:"जन्म 1908, बिहार। राष्ट्रकवि कहलाते हैं। ओज और वीर रस के कवि। प्रमुख रचनाएँ - कुरुक्षेत्र, रश्मिरथी, उर्वशी, हुंकार, परशुराम की प्रतीक्षा।"},
{q:"आचार्य रामचन्द्र शुक्ल का साहित्यिक परिचय लिखिए।",a:"जन्म 1884, बस्ती। हिन्दी के महान आलोचक और इतिहासकार। प्रमुख रचना - हिन्दी साहित्य का इतिहास, चिंतामणि, सूरदास, जायसी।"},
{q:"छायावाद की प्रमुख विशेषताएँ लिखिए।",a:"1. प्रकृति प्रेम 2. वैयक्तिक प्रेम और विरह 3. रहस्यवाद 4. कल्पना की प्रधानता 5. कोमल और मधुर भाषा 6. प्रतीकात्मकता 7. मानवीकरण।"},
{q:"प्रगतिवाद की प्रमुख विशेषताएँ लिखिए।",a:"1. समाजवादी विचारधारा 2. शोषित वर्ग का चित्रण 3. यथार्थवाद 4. शोषण का विरोध 5. सरल और आम भाषा 6. मार्क्सवाद का प्रभाव।"},
{q:"कहानी के प्रमुख तत्वों का वर्णन कीजिए।",a:"कहानी के 6 तत्व - 1. कथानक 2. पात्र और चरित्र चित्रण 3. संवाद 4. देशकाल और वातावरण 5. भाषा शैली 6. उद्देश्य।"},
{q:"निबंध की प्रमुख विशेषताएँ लिखिए।",a:"1. विचारों की क्रमबद्धता 2. एक विषय पर केन्द्रित 3. लेखक का व्यक्तित्व 4. रोचक भाषा 5. तर्कपूर्ण प्रस्तुति 6. संक्षिप्तता।"},
{q:"संस्मरण और रेखाचित्र में अंतर लिखिए।",a:"संस्मरण में लेखक अपने अतीत के अनुभव लिखता है, व्यक्ति प्रधान होता है। रेखाचित्र में किसी व्यक्ति या वस्तु का शब्दों में चित्र बनाया जाता है, वह अधिक कलात्मक होता है।"},
{q:"हिन्दी गद्य की प्रमुख विधाओं का वर्णन कीजिए।",a:"प्रमुख विधाएँ - निबंध, कहानी, उपन्यास, नाटक, संस्मरण, रेखाचित्र, जीवनी, आत्मकथा, यात्रा वृतांत, आलोचना, व्यंग्य।"},
{q:"हिन्दी काव्य की प्रमुख विशेषताएँ लिखिए।",a:"1. भाव और रस की प्रधानता 2. लय और छंद 3. अलंकार 4. प्रकृति चित्रण 5. भक्ति और प्रेम 6. राष्ट्रीय भावना।"},
{q:"कविता के प्रमुख तत्वों का वर्णन कीजिए।",a:"1. भाव 2. कल्पना 3. बुद्धि तत्व 4. शैली तत्व 5. लय और छंद 6. भाषा।"},
{q:"छायावादी काव्य की विशेषताएँ लिखिए।",a:"छायावाद में प्रेम, प्रकृति, विरह, रहस्यवाद, कल्पना, प्रतीक, मानवीकरण और कोमल भाषा की प्रधानता है। प्रसाद, पंत, निराला, महादेवी इसके प्रमुख कवि हैं।"},
{q:"हिन्दी साहित्य के इतिहास का काल विभाजन लिखिए।",a:"आचार्य शुक्ल के अनुसार - 1. आदिकाल (वीरगाथा काल) 993-1318 2. भक्तिकाल 1318-1643 3. रीतिकाल 1643-1843 4. आधुनिक काल 1843 से अब तक।"},
{q:"रस की परिभाषा एवं उसके प्रकार लिखिए।",a:"विभाव, अनुभाव और संचारी भाव के संयोग से उत्पन्न आनंद को रस कहते हैं। 9 रस हैं - शृंगार, हास्य, करुण, रौद्र, वीर, भयानक, वीभत्स, अद्भुत, शांत।"},
{q:"अलंकार की परिभाषा एवं उसके प्रकार लिखिए।",a:"काव्य की शोभा बढ़ाने वाले तत्व को अलंकार कहते हैं। 2 भेद - 1. शब्दालंकार - अनुप्रास, यमक, श्लेष 2. अर्थालंकार - उपमा, रूपक, उत्प्रेक्षा, अतिशयोक्ति।"},
{q:"छंद की परिभाषा एवं उसके प्रकार लिखिए।",a:"वर्णों और मात्राओं के निश्चित क्रम को छंद कहते हैं। 3 भेद - 1. वर्णिक छंद 2. मात्रिक छंद - दोहा, चौपाई, सोरठा, रोला 3. मुक्त छंद।"},
{q:"उपमा अलंकार और रूपक अलंकार में अंतर लिखिए।",a:"उपमा में उपमेय और उपमान में समानता बताई जाती है, जैसे - मुख चन्द्रमा के समान है। रूपक में उपमेय को ही उपमान मान लिया जाता है, जैसे - मुख ही चन्द्रमा है।"},
{q:"मुहावरे और लोकोक्तियों में अंतर लिखिए।",a:"मुहावरा वाक्य का अंश होता है, उसे पूरा करने के लिए वाक्य की जरूरत होती है, जैसे - आँखें दिखाना। लोकोक्ति पूरा वाक्य होती है, वह अपने आप में पूर्ण अर्थ देती है, जैसे - जैसी करनी वैसी भरनी।"},
{q:"संधि की परिभाषा एवं उसके भेद लिखिए।",a:"दो वर्णों के मिलने से होने वाले विकार को संधि कहते हैं। 3 भेद - 1. स्वर संधि 2. व्यंजन संधि 3. विसर्ग संधि। उदाहरण - विद्या+आलय=विद्यालय।"},
{q:"समास की परिभाषा एवं उसके भेद लिखिए।",a:"दो या दो से अधिक शब्दों के मेल से नया शब्द बनना समास कहलाता है। 6 भेद - अव्ययीभाव, तत्पुरुष, कर्मधारय, द्विगु, द्वंद्व, बहुव्रीहि।"},
{q:"वाक्य शुद्ध कीजिए।",a:"उदाहरण - अशुद्ध - मैंने पुस्तक पढ़ा। शुद्ध - मैंने पुस्तक पढ़ी। अशुद्ध - राम और श्याम खेलता है। शुद्ध - राम और श्याम खेलते हैं। क्रिया कर्ता के लिंग और वचन के अनुसार होती है।"},
{q:"अनेक शब्दों के लिए एक शब्द लिखिए।",a:"जो कभी न मरे - अमर, जो दिखाई न दे - अदृश्य, जो पहले कभी न हुआ हो - अभूतपूर्व, जिसके पास धन न हो - निर्धन, जो पढ़ा लिखा न हो - निरक्षर।"},
{q:"पर्यायवाची एवं विलोम शब्द लिखिए।",a:"पर्यायवाची - जल-पानी, नीर, सूर्य-रवि, भानु, चंद्रमा-शशि, चाँद। विलोम - सुख-दुख, हार-जीत, दिन-रात, अच्छा-बुरा, आगे-पीछे।"},
{q:"पर्यावरण प्रदूषण पर निबंध लिखिए।",a:"प्रस्तावना - पर्यावरण का अर्थ है हमारे आसपास का वातावरण। कारण - फैक्ट्री का धुआँ, वाहनों का धुआँ, प्लास्टिक, कचरा। प्रभाव - बीमारियाँ, ग्लोबल वार्मिंग। उपाय - वृक्षारोपण, प्लास्टिक का त्याग, स्वच्छता। निष्कर्ष - पर्यावरण बचाना हमारा कर्तव्य है।"},
{q:"बेरोजगारी की समस्या पर निबंध लिखिए।",a:"प्रस्तावना - बेरोजगारी देश की सबसे बड़ी समस्या है। कारण - जनसंख्या वृद्धि, शिक्षा में व्यावसायिकता की कमी, औद्योगीकरण की कमी। प्रभाव - गरीबी, अपराध। उपाय - कौशल विकास, स्वरोजगार, उद्योगों को बढ़ावा।"},
{q:"महिला सशक्तिकरण पर निबंध लिखिए।",a:"महिला सशक्तिकरण का अर्थ है महिलाओं को शिक्षा, आर्थिक और सामाजिक रूप से मजबूत बनाना। उपाय - बेटी बचाओ बेटी पढ़ाओ, शिक्षा, समान अधिकार, सुरक्षा। निष्कर्ष - महिला सशक्त तो समाज सशक्त।"},
{q:"विज्ञान: वरदान या अभिशाप पर निबंध लिखिए।",a:"विज्ञान ने हमें मोबाइल, इंटरनेट, बिजली, दवाई दी, यह वरदान है। लेकिन परमाणु बम, प्रदूषण, हथियार अभिशाप हैं। निष्कर्ष - विज्ञान का सही उपयोग ही वरदान है, गलत उपयोग अभिशाप।"},
{q:"विद्यार्थी जीवन में अनुशासन पर निबंध लिखिए।",a:"अनुशासन ही विद्यार्थी की सफलता की कुंजी है। अनुशासन से समय का सदुपयोग, पढ़ाई में मन, अच्छे संस्कार आते हैं। बिना अनुशासन के विद्यार्थी असफल होता है।"},
{q:"भारतीय संस्कृति पर निबंध लिखिए।",a:"भारतीय संस्कृति सबसे प्राचीन है। इसकी विशेषता - अतिथि देवो भव, वसुधैव कुटुम्बकम, अनेकता में एकता, अहिंसा, त्याग, संस्कार, पर्व-त्योहार। यही हमारी पहचान है।"},
{q:"सोशल मीडिया का प्रभाव पर निबंध लिखिए।",a:"लाभ - ज्ञान, संपर्क, जानकारी, व्यापार। हानि - समय की बर्बादी, गलत जानकारी, नशा, मानसिक तनाव। निष्कर्ष - सीमित और सही उपयोग करना चाहिए।"},
{q:"विकसित भारत 2047 पर निबंध लिखिए।",a:"2047 में भारत आजादी के 100 साल पूरे करेगा। लक्ष्य - गरी
